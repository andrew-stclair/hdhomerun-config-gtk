<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5ca0e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a76cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="0" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shape (Modern Adwaita Rounding) -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Stylized 'SD' - Simplified for icon clarity -->
  <g fill="white">
    <!-- 'S' -->
    <path d="M36 44 H60 V54 H46 V62 H60 V84 H36 V74 H50 V66 H36 Z" />
    <!-- 'D' -->
    <path d="M68 44 H82 C90 44 94 48 94 54 V74 C94 80 90 84 82 84 H68 Z M78 54 V74 H82 C83 74 84 73 84 72 V56 C84 55 83 54 82 54 Z" />
  </g>
  
  <!-- Subtle Reflection -->
  <rect x="8" y="8" width="112" height="56" rx="24" fill="white" opacity="0.1" />
</svg>
